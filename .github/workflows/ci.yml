name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary local database password
        run: python3 -c 'import pathlib,secrets; pathlib.Path(".env").write_text("POSTGRES_PASSWORD=" + secrets.token_hex(24) + "\n")'
      - run: docker compose up --build -d
      - name: Wait for database readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run known-answer workflow and verify restart persistence
        run: python3 scripts/demo.py --verify-restart
      - name: Collect service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-demo-results
          path: artifacts/demo-result.*
      - name: Remove temporary containers and data
        if: always()
        run: docker compose down --volumes
