services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__Database: "Host=db;Database=meterflow;Username=meterflow;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Database__MigrateOnStartup: "true"
      DataProtection__KeyPath: /var/meterflow/keys
    volumes:
      - key_data:/var/meterflow/keys
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: meterflow
      POSTGRES_DB: meterflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterflow -d meterflow"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  key_data:
